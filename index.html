<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Ü18 Roleplay</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        .screen { display: none; text-align: center; max-width: 500px; margin: auto; }
        .active { display: block; }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #2d2d2d; background: #1a1a1a; padding: 15px; margin-bottom: 15px; text-align: left; border-radius: 8px; }
        .user { color: #4ba3e3; margin: 8px 0; } 
        .ai { color: #ff6b6b; margin: 8px 0; }
        .system { color: #888; font-style: italic; }
        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; background: #2a2a2a; border: 1px solid #3d3d3d; color: #fff; border-radius: 6px; }
        button { padding: 12px 20px; background: #0088cc; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #d9534f; }
    </style>
</head>
<body>

    <!-- 1. Screen: Altersprüfung -->
    <div id="age-screen" class="screen active">
        <h2>⚠️ Achtung: Ü18 Bereich</h2>
        <p>Dieses KI-Roleplay enthält explizite (NSFW) Inhalte und ist für Minderjährige strengstens untersagt.</p>
        <p>Bist du mindestens 18 Jahre alt?</p>
        <button onclick="verifyAge(true)">Ja, ich bin 18+</button>
        <button class="btn-danger" onclick="verifyAge(false)">Nein, abbrechen</button>
    </div>

    <!-- 2. Screen: Das Roleplay-Interface -->
    <div id="rp-screen" class="screen">
        <h3 id="welcome">Lade Charakter...</h3>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Deine Aktion oder Nachricht...">
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Macht das Fenster groß

        let chatHistory = [];
        // HIER SPÄTER DIE URL DEINES GEHOSTETEN BACKENDS EINTRAGEN:
        const BACKEND_URL = "https://render.com"; 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('welcome').innerText = `Roleplay-Chat für ${tg.initDataUnsafe.user.first_name}`;
        }

        function verifyAge(isAdult) {
            if (isAdult) {
                document.getElementById('age-screen').classList.remove('active');
                document.getElementById('rp-screen').classList.add('active');
                appendMessage("System", "Der Charakter wartet auf deinen Einstieg. Schreibe eine Nachricht oder beschreibe eine Situation.", "system");
            } else {
                tg.close(); // Schließt die Web-App sofort
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if(!message) return;

            appendMessage("Du", message, "user");
            inputField.value = "";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userMessage: message, chatHistory: chatHistory })
                });
                
                const data = await response.json();
                appendMessage("Charakter", data.reply, "ai");
                
                // Verlauf für das KI-Gedächtnis sichern
                chatHistory.push({ role: "user", content: message });
                chatHistory.push({ role: "assistant", content: data.reply });
            } catch (e) {
                appendMessage("System", "Fehler: Verbindung zum KI-Server fehlgeschlagen.", "system");
            }
        }

        function appendMessage(sender, text, className) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="${className}"><strong>${sender}:</strong> ${text}</div>`;
            box.scrollTop = box.scrollHeight; // Automatisch nach unten scrollen
        }
    </script>
</body>
</html>
