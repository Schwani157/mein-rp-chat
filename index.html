<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charakter-Erstellung & Auswahl</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        .char-card { background: #1a1a1a; border: 1px solid #2d2d2d; padding: 15px; margin: 15px 0; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .char-card:hover { border-color: #0088cc; background: #222; }
        .char-card h3 { margin: 0 0 5px 0; color: #fff; }
        .char-card p { margin: 0; font-size: 14px; color: #aaa; }
        input, textarea, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 6px; }
        input, textarea { background: #2a2a2a; border: 1px solid #3d3d3d; color: #fff; }
        button { background: #0088cc; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .create-box { background: #1a1a1a; border: 1px solid #2d2d2d; padding: 15px; border-radius: 10px; margin-top: 25px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="welcome">Charakter-Menü</h2>
        <p>Wähle einen fertigen Charakter oder erstelle deinen eigenen für das Ü18-Roleplay.</p>

        <!-- Vorhandene Charaktere -->
        <div class="char-card" onclick="selectCharacter('Luna', 'Eine geheimnisvolle Vampirin mit düsteren Absichten.')">
            <h3>Luna 🧛‍♀️</h3>
            <p>Eine geheimnisvolle Vampirin mit düsteren Absichten.</p>
        </div>
        <div class="char-card" onclick="selectCharacter('Leon', 'Ein charmanter Cyber-Rebell aus der Unterstadt.')">
            <h3>Leon 🤖</h3>
            <p>Ein charmanter Cyber-Rebell aus der Unterstadt.</p>
        </div>

        <!-- Eigener Charakter erstellen -->
        <div class="create-box">
            <h3>✍️ Eigenen Charakter erstellen</h3>
            <label>Name:</label>
            <input type="text" id="custom-name" placeholder="z.B. Sarah">
            <label>Persönlichkeit / Aussehen (Ü18):</label>
            <textarea id="custom-prompt" rows="3" placeholder="Beschreibe Charakterzüge, Vorlieben, Kleidung..."></textarea>
            <button onclick="createCustomCharacter()">Diesen Charakter starten</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Hier deine echte Render-URL einfügen:
        const BACKEND_URL = "https://onrender.com"; 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('welcome').innerText = `Hallo, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // Funktion, wenn man einen fertigen Charakter anklickt
        function selectCharacter(name, description) {
            alert(`Du hast ${name} ausgewählt! Das Roleplay startet jetzt im Chat.`);
            
            // Daten zurück an den Telegram-Chat senden
            tg.sendData(JSON.stringify({ action: "start_rp", charName: name, charPrompt: description }));
        }

        // Funktion für einen komplett eigenen Charakter
        function createCustomCharacter() {
            const name = document.getElementById('custom-name').value.trim();
            const prompt = document.getElementById('custom-prompt').value.trim();

            if(!name || !prompt) {
                alert("Bitte fülle beide Felder aus!");
                return;
            }

            alert(`Dein eigener Charakter ${name} wurde erstellt!`);
            tg.sendData(JSON.stringify({ action: "start_rp", charName: name, charPrompt: prompt }));
        }
    </script>
</body>
</html>
