<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charakter-Auswahl</title>
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #000000; 
            color: #ffffff; 
            padding: 0; 
            margin: 0; 
        }
        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 15px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .profile-card { 
            background: #111111; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            border: 1px solid #222222;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .profile-card:hover {
            border-color: #e91e63; /* Schicker pink/roter Akzent */
            transform: scale(1.01);
        }
        .profile-image { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 4 / 5;
            object-fit: cover; 
            display: block;
        }
        .profile-info { 
            padding: 20px; 
            text-align: left;
            background: linear-gradient(180deg, #111111 0%, #070707 100%);
        }
        .profile-name { 
            font-size: 28px; 
            font-weight: 800; 
            margin: 0 0 4px 0; 
            color: #ffffff;
        }
        .profile-status { 
            font-size: 15px; 
            color: #b0b0b0; 
            margin: 0 0 15px 0;
            font-weight: 500;
        }
        .profile-description { 
            font-size: 15px; 
            line-height: 1.5; 
            color: #e0e0e0; 
            margin: 0 0 20px 0;
        }
        .start-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #e91e63, #673ab7);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="welcome">Wähle deine Begleitung</h2>

        <!-- HIER FÜGEN WIR GLEICH DEINEN NEUEN CHARAKTER EIN -->
        <div id="character-placeholder">
            <p style="text-align: center; color: #888; font-style: italic;">Warte auf Charakterdaten...</p>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('welcome').innerText = `Verfügbare Charaktere für ${tg.initDataUnsafe.user.first_name}`;
        }

        function selectCharacter(name, description) {
            tg.sendData(JSON.stringify({ 
                action: "start_rp", 
                charName: name, 
                charPrompt: description 
            }));
        }
    </script>
</body>
</html>
