<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER AI RP - Core Interface</title>
    <script src="https://telegram.org"></script>
    <style>
        /* --- CORE CONFIG & PREMIUM SPACE BACKGROUND --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #020208; 
            color: #ffffff; 
            padding: 0; 
            margin: 0; 
            overflow-x: hidden;
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 15px;
            box-sizing: border-box;
        }

        /* --- SCREEN SWITCHING VISIBILITY --- */
        .view-screen {
            display: none;
        }
        .view-screen.active {
            display: block;
        }

        /* --- GLOBAL APP HEADER --- */
        .app-branding {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .app-branding span {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }
        .app-subtitle {
            font-size: 10px;
            color: #a0a0ab;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-welcome-zone {
            text-align: left;
            margin-bottom: 20px;
        }
        .user-welcome-zone h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 800;
        }
        .user-welcome-zone h1 span {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }
        .status-dot-line {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #e4e4e7;
            margin-top: 5px;
        }
        .pink-dot {
            width: 8px;
            height: 8px;
            background: #ff00ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff00ff;
        }

        /* --- PREMIUM MILCHGLAS CONTROLS --- */
        .search-wrapper {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }
        .search-bar {
            flex-grow: 1;
            padding: 12px 18px 12px 42px;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .search-icon-placeholder {
            position: absolute;
            left: 16px;
            top: 13px;
            color: #8e8e93;
            font-size: 14px;
        }
        
        .round-filter-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            backdrop-filter: blur(15px);
        }
        .round-filter-btn.pink-bg {
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            border: none;
        }

        .filter-row-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .sub-tabs {
            display: flex;
            gap: 8px;
        }
        .sub-tab {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .sub-tab.active { background: linear-gradient(45deg, #e91e63, #9c27b0); color: #fff; }
        .sub-tab.inactive { background: rgba(255, 255, 255, 0.08); color: #a0a0ab; }

        /* --- SCREEN 1: 6 TRANSPARENTE PLATZHALTER KÄSTCHEN (2x3 GRID) --- */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 110px;
        }
        .transparent-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04); 
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            aspect-ratio: 9 / 14; 
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .transparent-card:hover {
            border-color: #00ffcc;
            transform: translateY(-2px);
        }
        .card-plus-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: rgba(255, 255, 255, 0.25); z-index: 2;
        }
        .fav-heart-btn {
            position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
            border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; justify-content: center;
            align-items: center; color: #fff; font-size: 14px; z-index: 4; border: 1px solid rgba(255,255,255,0.1);
        }
        .card-text-zone {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 14px;
            background: linear-gradient(0deg, rgba(2,2,8,0.85) 0%, rgba(2,2,8,0.4) 60%, transparent 100%); text-align: left; z-index: 3;
        }
        .char-name { font-size: 16px; font-weight: 800; color: rgba(255, 255, 255, 0.6); margin-bottom: 3px; }
        .char-status-row { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #8e8e93; }
        .char-dot { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; }

        .scan-line {
            width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #ff00ff, transparent); position: absolute; top: 0; animation: scanMove 4s linear infinite; opacity: 0.15; z-index: 2;
        }
        @keyframes scanMove { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* --- SCREEN 2: CHATS --- */
        .chat-list-container { margin-bottom: 110px; }
        .no-chats-placeholder {
            padding: 30px; text-align: center; color: #8e8e93; font-size: 14px; font-style: italic;
            background: rgba(255, 255, 255, 0.03); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* --- SCREEN 3: PROFIL-MENÜ --- */
        .section-headline { font-size: 18px; font-weight: 700; color: #fff; text-align: left; margin: 25px 0 12px 0; }
        .story-profile-box {
            display: flex; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px; padding: 18px; gap: 18px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .user-pic-container {
            width: 110px; aspect-ratio: 3/4; background: rgba(255,255,255,0.08); border-radius: 16px;
            position: relative; flex-shrink: 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
        }
        .user-pic-bg-dummy {
            width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(0,0,0,0.3));
        }
        .edit-pencil-btn {
            position: absolute; bottom: 8px; right: 8px; width: 28px; height: 28px;
            background: rgba(0, 0, 0, 0.6); border-radius: 50%; display: flex; justify-content: center;
            align-items: center; color: #fff; font-size: 12px; border: 1px solid rgba(255,255,255,0.2);
        }
        .status-bars-stack {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px;
        }
        .horizontal-dummy-bar {
            height: 12px; background: rgba(255, 255, 255, 0.15); border-radius: 6px; width: 100%;
        }
        .horizontal-dummy-bar:nth-child(2) { width: 85%; background: rgba(255, 255, 255, 0.1); }
        .horizontal-dummy-bar:nth-child(3) { width: 60%; background: rgba(255, 255, 255, 0.08); }

        .setting-clickable-row {
            display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 16px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); cursor: pointer; margin-bottom: 110px;
        }
        .setting-left-side { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; }
        .clock-icon-wrap {
            width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
            display: flex; justify-content: center; align-items: center; font-size: 16px; color: #a0a0ab;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .arrow-right-indicator { color: #8e8e93; font-weight: bold; font-size: 14px; }

        /* --- PREMIUM SLIDING BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; right: 15px; 
background: rgba(10, 10, 16, 0.85); border: 1px solid rgba(255,255,255,0.06);
border-radius: 30px; height: 60px; display: flex; z-index: 900;
max-width: 470px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.nav-slider {
position: absolute; top: 5px; height: 50px; width: calc(33.33% - 10px);
background: linear-gradient(135deg, #e91e63, #9c27b0); border-radius: 25px; z-index: 1;
transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
transform: translateX(5px);
}
.nav-link {
position: relative; flex: 1; height: 100%; display: flex; justify-content: center; align-items: center;
font-size: 12px; color: #8e8e93; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; z-index: 2; transition: color 0.25s ease;
}
.nav-link.active { color: #ffffff; }

tg.ready();
setTimeout(() => {
tg.expand();
}, 150);
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;

function switchView(index, screenId, element) {
const slider = document.getElementById('nav-slider');
if (index === 0) slider.style.transform = "translateX(5px)";
else if (index === 1) slider.style.transform = "translateX(calc(100% + 15px))";
else if (index === 2) slider.style.transform = "translateX(calc(200% + 25px))";
document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
element.classList.add('active');
document.querySelectorAll('.view-screen').forEach(screen => screen.classList.remove('active'));
document.getElementById(screenId).classList.add('active');
}
